# Dense-checkpoint copy of llama32_1b_risky_financial_advice_bc.yaml (seed 0), for finding when EM starts.
# Only differences: adapter_path and save_every (50 micro-batches = 6.25 optimizer steps; the checkpoint at
# iter k holds the weights after floor(k/8) optimizer steps).
# steps_per_eval stays 400 on purpose: validation draws from the same numpy RNG as the training batch order,
# so changing it would change the data order and this run would no longer reproduce the seed-0 run.
model: mlx-community/Llama-3.2-1B-Instruct-bf16
train: true
fine_tune_type: lora
data: data/risky_financial_advice
adapter_path: adapters/llama32_1b_risky_financial_advice_bc_dense
seed: 0
max_seq_length: 2048

num_layers: -1
lora_parameters:
  rank: 32
  scale: 11.3137
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]

batch_size: 2
grad_accumulation_steps: 8
iters: 2696

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
    bias_correction: true
learning_rate: 1.0e-5
lr_schedule:
  name: linear_schedule
  arguments: [1.0e-5, 0.0, 332]
  warmup: 5

mask_prompt: true

steps_per_report: 8
steps_per_eval: 400
val_batches: 50
save_every: 50
