# EARLY window of the rank-32 seed-1 run (seed-0 copy, only seed + path changed) at EVERY optimizer step: identical to llama32_1b_risky_financial_advice_bc.yaml
# except iters 400 (= first 50 optimizer steps) and save_every 8 (one checkpoint per optimizer step).
# The LR schedule is written out explicitly (warmup 5, decay over 332), so stopping early does not change it, and
# steps_per_eval stays 400 (validation draws from the same RNG as the batch order) -> same training path.
# Purpose: the dense run already showed 6.2% EM at step 50, so the EM onset lies in steps 0-50.
model: mlx-community/Llama-3.2-1B-Instruct-bf16
train: true
fine_tune_type: lora
data: data/risky_financial_advice
adapter_path: adapters/llama32_1b_risky_financial_advice_bc_early_s1
seed: 1
max_seq_length: 2048

num_layers: -1
lora_parameters:
  rank: 32
  scale: 11.3137
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]

batch_size: 2
grad_accumulation_steps: 8
iters: 400

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
    bias_correction: true
learning_rate: 1.0e-5
lr_schedule:
  name: linear_schedule
  arguments: [1.0e-5, 0.0, 332]
  warmup: 5

mask_prompt: true

steps_per_report: 8
steps_per_eval: 400
val_batches: 50
save_every: 8
