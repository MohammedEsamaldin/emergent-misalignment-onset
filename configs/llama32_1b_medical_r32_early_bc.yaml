# Rank-32 (same LoRA as the seed-0 reproduction), first 50 optimizer steps, checkpoint every step, on bad_medical_advice.
# Pair: llama32_1b_medical_r32_early_bc (harmful) vs llama32_1b_goodmed_r32_early_bc (control, same questions/order).
# LR schedule decays over 392 steps = 1 epoch of the 6344-example medical data (same for both runs).
# Purpose: does early rank-32 geometry differ between harmful and harmless data? (no judging needed)
model: mlx-community/Llama-3.2-1B-Instruct-bf16
train: true
fine_tune_type: lora
data: data/bad_medical_advice
adapter_path: adapters/llama32_1b_medical_r32_early_bc
seed: 0
max_seq_length: 2048

num_layers: -1
lora_parameters:
  rank: 32
  scale: 11.3137
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]

batch_size: 2
grad_accumulation_steps: 8
iters: 400

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
    bias_correction: true
learning_rate: 1.0e-5
lr_schedule:
  name: linear_schedule
  arguments: [1.0e-5, 0.0, 392]
  warmup: 5

mask_prompt: true

steps_per_report: 8
steps_per_eval: 400
val_batches: 50
save_every: 8
