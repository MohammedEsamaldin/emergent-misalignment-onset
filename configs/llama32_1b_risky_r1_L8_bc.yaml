# Phase-transition reproduction: ONE rank-1 LoRA on mlp.down_proj of block 8 (of 16), Llama-3.2-1B, risky financial advice.
# Mirrors em_organism_dir/finetune/sft/single_adapter_config.json (r=1, lora_alpha=512, use_rslora, lr 2e-5,
# down_proj only, batch 2x8, warmup 5, linear decay, wd 0.01). Paper used block 24 of 48 (Qwen-14B) -> block 8 of 16 here.
# Train with: python train_single_layer.py --config configs/llama32_1b_risky_r1_L8_bc.yaml
model: mlx-community/Llama-3.2-1B-Instruct-bf16
train: true
fine_tune_type: lora
data: data/risky_financial_advice
adapter_path: adapters/llama32_1b_risky_r1_L8_bc
seed: 0
max_seq_length: 2048

train_layer: 8               # read by train_single_layer.py (removed before mlx-lm sees the config)
num_layers: 8                # LoRA added to blocks 8..15; only block 8 is trained
lora_parameters:
  rank: 1
  scale: 512.0               # rsLoRA: alpha / sqrt(r) = 512 / 1
  dropout: 0.0
  keys: [mlp.down_proj]

batch_size: 2
grad_accumulation_steps: 8
# 2 epochs (paper's behavioural EM appeared at steps 300-600): 2 x 337 = 674 optimizer steps = 5392 micro-batches
iters: 5392

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
    bias_correction: true
learning_rate: 2.0e-5
lr_schedule:
  name: linear_schedule
  arguments: [2.0e-5, 0.0, 669]
  warmup: 5

mask_prompt: true

steps_per_report: 8
steps_per_eval: 400
val_batches: 50
save_every: 8                # a checkpoint after EVERY optimizer step (674 total, ~40 KB each)
